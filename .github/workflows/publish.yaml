name: Publish to PyPI

on:
  push:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          # Additional dependencies for native extensions if any
          if contains(matrix.os, 'ubuntu'); then
            sudo apt-get update
            sudo apt-get install -y libeigen3-dev
          elif contains(matrix.os, 'windows'); then
            # Download Eigen for Windows
            echo "Downloading Eigen for Windows..."
            curl -L https://gitlab.com/libeigen/eigen/-/archive/5.0.0/eigen-5.0.0.zip -o eigen.zip
            unzip eigen.zip -d eigen_temp
            echo "EIGEN3_INCLUDE_DIR=$(pwd)/eigen_temp/eigen-5.0.0" >> $GITHUB_ENV
          fi
      - name: Build binary wheel and source tarball
        run: python -m build --sdist --wheel --outdir dist/ .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@v5
      - name: Download all dists
        uses: actions/download-artifact@v5
        with:
          path: all-dists
      - name: List downloaded files
        run: ls -R all-dists
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository_url: https://upload.pypi.org/legacy/
          packages_dir: all-dists/
