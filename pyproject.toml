[project]
name = "algofuzz"
version = "0.1.0"
description = "A unique framework dedicated to the implementation and comparison of various fuzzy c-means clustering algorithms."
authors = [
    { name = "MB. Naghi", email = "mirtill@naghi.me" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["fuzzing", "genetic-algorithms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.11.10",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.6",
    "p_tqdm>=1.4.2",
    "deap>=1.4.3",
    "joblib>=1.5.2",
]

[project.urls]
"Homepage" = "https://github.com/naghim/algofuzz"
"Bug Tracker" = "https://github.com/naghim/algofuzz/issues"

[build-system]
requires = ["scikit-build-core", "cmake>=3.18", "ninja>=1.10", "pybind11>=3.0.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.source-dir = "native/cpp"
